[package]
name = "maivin-navsat"
description = "Maivin NavSat Service"
repository = "https://bitbucket.org/au-zone/maivin-navsat"
license = "CLOSED"
version = "0.0.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false

[profile.profiling]
inherits = "release"
strip = false
debug = true

[dependencies]
clap = { version = "4.4.6", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
zenoh = "0.10.0-rc"
edgefirst-schemas = "1.2.1"
cdr = "0.2.4"
gpsd_proto = "1.0.0"
itertools = "0.12.1"
libc = "0.2.154"
