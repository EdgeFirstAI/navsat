[package]
name = "maivin-navsat"
description = "Maivin NavSat Service"
repository = "https://bitbucket.org/au-zone/maivin-navsat"
license = "CLOSED"
version = "0.0.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true

[dependencies]
clap = { version = "4.4.6", features = ["derive"] }
zenoh = "0.10.0-rc"
zenoh-ros-type = { git = "https://github.com/MaivinAI/zenoh-ros-type" }
cdr = "0.2.4"
gpsd_proto = "1.0.0"
itertools = "0.12.1"