[package]
name = "maivin-navsat"
description = "Maivin NavSat Service"
repository = "https://bitbucket.org/au-zone/maivin-navsat"
license = "CLOSED"
version = "0.0.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false

[profile.profiling]
inherits = "release"
strip = false
debug = true

[dependencies]
cdr = "0.2.4"
clap = { version = "4.5.30", features = ["derive"] }
edgefirst-schemas = "1.2.4"
env_logger = "0.11.6"
gpsd_proto = "1.0.0"
itertools = "0.14.0"
libc = "0.2.169"
log = "0.4.25"
zenoh = "0.10.0-rc"
