[package]
name = "navsat"
description = "Maivin NavSat publishing service using Zenoh"
repository = "https://bitbucket.org/au-zone/maivin-navsat"
license = "CLOSED"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.4.6", features = ["derive"] }
zenoh = "0.10.0-rc"
zenoh-ros-type = { git = "https://github.com/MaivinAI/zenoh-ros-type" }
cdr = "0.2.4"
gpsd_proto = "1.0.0"
itertools = "0.11.0"