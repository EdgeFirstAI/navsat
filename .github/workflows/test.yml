# GitHub Actions workflow for testing and code quality
#
# This workflow implements the three-phase pattern for on-target testing with coverage:
# Phase 1: Build instrumented binaries on ARM runner
# Phase 2: Run tests on real hardware (raivin with GPS)
# Phase 3: Process coverage data on ARM runner (matching toolchain)
#
# Action Versions (hash-pinned per SPS 11-cicd-pipelines.md):

name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561  # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561  # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb  # v5.0.1
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb  # v5.0.1
        with:
          path: target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build-and-test:
    name: Build & Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      matrix:
        platform:
          - name: x86_64
            runner: ubuntu-22.04
          - name: aarch64
            runner: ubuntu-22.04-arm
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561  # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@dfcb1ee29051d97c8d0f2d437199570008fd5612  # v2.65.15
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Cache cargo registry
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb  # v5.0.1
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-index-

      - name: Run unit tests with coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path coverage.lcov

      - name: Generate Cobertura format for compatibility
        run: |
          cargo llvm-cov --workspace --cobertura --output-path coverage.xml

      - name: Build instrumented test binaries (aarch64 only)
        if: matrix.platform.name == 'aarch64'
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo nextest run --workspace --no-run --run-ignored=all
          mkdir -p target/tests
          find target/llvm-cov-target/debug/deps/ -maxdepth 1 -type f -executable \
            \( -name "edgefirst_navsat-*" -o -name "*integration*" \) \
            -exec cp {} target/tests/ \;

      - name: Build instrumented release binary (aarch64 only)
        if: matrix.platform.name == 'aarch64'
        run: |
          # Build release binary with coverage instrumentation for Zenoh integration tests
          # Use cargo llvm-cov to ensure binary is built with instrumentation in llvm-cov-target
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov build --release --no-report
          mkdir -p target/release-instrumented
          cp target/llvm-cov-target/release/edgefirst-navsat target/release-instrumented/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: coverage-${{ matrix.platform.name }}
          path: |
            coverage.lcov
            coverage.xml
          retention-days: 30

      - name: Upload instrumented objects (aarch64 only)
        if: matrix.platform.name == 'aarch64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: rust-llvm-cov-aarch64
          path: target/llvm-cov-target/
          retention-days: 7

      - name: Upload test binaries (aarch64 only)
        if: matrix.platform.name == 'aarch64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: integration-tests-aarch64
          path: target/tests/
          retention-days: 7

      - name: Upload release binary (aarch64 only)
        if: matrix.platform.name == 'aarch64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: release-binary-aarch64
          path: target/release-instrumented/
          retention-days: 7

  hardware-test:
    name: Hardware Integration Tests (raivin)
    needs: build-and-test
    runs-on: raivin
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'test-hardware')

    steps:
      - name: Clean workspace
        run: |
          rm -rf target/ integration-tests/ coverage/ 2>/dev/null || true
          find . -name "*.profraw" -delete 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Download test binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: integration-tests-aarch64
          path: integration-tests/

      - name: Make binaries executable
        run: chmod +x integration-tests/*

      - name: Check GPSD availability
        run: |
          if ! systemctl is-active --quiet gpsd; then
            echo "Warning: GPSD not running. Starting GPSD..."
            sudo systemctl start gpsd || true
          fi
          gpspipe -w -n 5 || echo "Warning: No GPS data available"

      - name: Run hardware tests
        run: |
          mkdir -p coverage/profraw coverage/results
          export LLVM_PROFILE_FILE="${{ github.workspace }}/coverage/profraw/raivin-%p-%m.profraw"
          
          TEST_FAILED=0
          for test_bin in integration-tests/*; do
            if [ -x "$test_bin" ]; then
              test_name=$(basename "$test_bin")
              echo "=== Running $test_name ==="
              if ! "$test_bin" --include-ignored --test-threads=1 2>&1 | tee "coverage/results/${test_name}.txt"; then
                TEST_FAILED=1
              fi
            fi
          done
          
          exit $TEST_FAILED

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: coverage-hardware
          path: |
            coverage/profraw/
            coverage/results/
          retention-days: 30

  zenoh-integration-test:
    name: Zenoh Integration Test (raivin)
    needs: build-and-test
    runs-on: raivin
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'test-hardware')

    steps:
      - name: Clean workspace
        run: |
          rm -rf build/ coverage/ test-results/ test-venv/ 2>/dev/null || true
          find . -name "*.profraw" -delete 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Download release binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: release-binary-aarch64
          path: build/

      - name: Make binary executable
        run: chmod +x build/edgefirst-navsat

      - name: Set up Python test environment
        run: |
          python3 -m venv test-venv
          test-venv/bin/pip install --upgrade pip
          test-venv/bin/pip install -r tests/requirements.txt

      - name: Start maivin-navsat service in background
        run: |
          export LLVM_PROFILE_FILE="${{ github.workspace }}/coverage/zenoh-%p-%m.profraw"
          mkdir -p coverage
          
          # Start service in background
          ./build/edgefirst-navsat --topic rt/gps &
          NAVSAT_PID=$!
          echo $NAVSAT_PID > navsat.pid
          
          # Wait for service to start
          sleep 5
          
          # Check if still running
          if ! kill -0 $NAVSAT_PID 2>/dev/null; then
            echo "ERROR: edgefirst-navsat failed to start"
            exit 1
          fi
          
          echo "edgefirst-navsat service started (PID: $NAVSAT_PID)"

      - name: Run Python Zenoh integration tests
        run: |
          test-venv/bin/pytest tests/test_zenoh_integration.py \
            -v \
            --junit-xml=test-results/pytest-zenoh.xml \
            --tb=short \
            -m hardware \
            || TEST_FAILED=$?
          
          # Always try to stop service gracefully
          if [ -f navsat.pid ]; then
            kill $(cat navsat.pid) 2>/dev/null || true
            sleep 2
            kill -9 $(cat navsat.pid) 2>/dev/null || true
          fi
          
          exit ${TEST_FAILED:-0}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: zenoh-test-results
          path: test-results/
          retention-days: 30

      - name: Upload Zenoh coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: coverage-zenoh
          path: coverage/
          retention-days: 30

  process-hardware-coverage:
    name: Process Hardware Coverage
    needs: [build-and-test, hardware-test, zenoh-integration-test]
    runs-on: ubuntu-22.04-arm
    if: always() && needs.build-and-test.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561  # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Download instrumented objects
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: rust-llvm-cov-aarch64
          path: target/llvm-cov-target/

      - name: Download hardware test profraw files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        continue-on-error: true
        with:
          name: coverage-hardware
          path: coverage-hardware/

      - name: Download zenoh test profraw files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        continue-on-error: true
        with:
          name: coverage-zenoh
          path: coverage-zenoh/

      - name: Process coverage
        run: |
          TOOLCHAIN_ROOT=$(rustc --print sysroot)
          LLVM_PROFDATA=$(find "$TOOLCHAIN_ROOT" -name "llvm-profdata" | head -1)
          LLVM_COV=$(find "$TOOLCHAIN_ROOT" -name "llvm-cov" | head -1)

          echo "=== Profraw files from hardware tests ==="
          find coverage-hardware/ -name "*.profraw" 2>/dev/null || echo "No hardware profraw files"

          echo ""
          echo "=== Profraw files from zenoh tests ==="
          find coverage-zenoh/ -name "*.profraw" 2>/dev/null || echo "No zenoh profraw files"

          # Collect all profraw files
          PROFRAW_FILES=$(find coverage-hardware/ coverage-zenoh/ -name "*.profraw" 2>/dev/null | tr '\n' ' ')

          if [ -z "$PROFRAW_FILES" ]; then
            echo "No profraw files found, skipping coverage processing"
            exit 0
          fi

          mkdir -p coverage
          echo "Merging profraw files..."
          "$LLVM_PROFDATA" merge -sparse $PROFRAW_FILES -o coverage/hardware.profdata

          if [ -f coverage/hardware.profdata ]; then
            # Find instrumented objects (test binaries)
            OBJECT_FILES=""
            for obj in $(find target/llvm-cov-target/debug/deps -maxdepth 1 -type f \
                         ! -name "*.d" ! -name "*.rlib" ! -name "*.rmeta" 2>/dev/null); do
              if file "$obj" | grep -q "ELF"; then
                OBJECT_FILES="$OBJECT_FILES --object=$obj"
              fi
            done

            # Also include the instrumented release binary
            if [ -f target/llvm-cov-target/release/edgefirst-navsat ]; then
              if file target/llvm-cov-target/release/edgefirst-navsat | grep -q "ELF"; then
                OBJECT_FILES="$OBJECT_FILES --object=target/llvm-cov-target/release/edgefirst-navsat"
              fi
            fi

            if [ -n "$OBJECT_FILES" ]; then
              echo "Generating LCOV report..."
              "$LLVM_COV" export --format=lcov \
                --instr-profile=coverage/hardware.profdata \
                --ignore-filename-regex='/.cargo/registry|/rustc/' \
                $OBJECT_FILES > coverage/coverage-hardware.lcov 2>/dev/null || echo "No coverage data"
            else
              echo "No instrumented objects found"
            fi
          fi

      - name: Upload processed coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: coverage-hardware-processed
          path: coverage/coverage-hardware.lcov
          retention-days: 30
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud Analysis
    needs: [build-and-test, hardware-test, zenoh-integration-test, process-hardware-coverage]
    runs-on: ubuntu-22.04
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0

      - name: Download all coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: coverage-*
          path: coverage/

      - name: Generate test summary
        if: always()
        run: |
          echo "# 📊 NavSat Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🧪 Test Platforms" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu 22.04 | x86_64 | Unit tests ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu 22.04 | aarch64 | Unit tests ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Raivin | aarch64 | Rust hardware tests (GPS) ${{ needs.hardware-test.result == 'success' && '✓' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Raivin | aarch64 | Python Zenoh integration ${{ needs.zenoh-integration-test.result == 'success' && '✓' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Coverage Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find coverage/ -name "*.lcov" -o -name "*.xml" 2>/dev/null | while read f; do
            echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY
          done || echo "No coverage files found" >> $GITHUB_STEP_SUMMARY

      - name: Prepare coverage paths
        id: coverage
        run: |
          LCOV_PATHS=$(find coverage/ -name "*.lcov" 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          echo "lcov_paths=$LCOV_PATHS" >> $GITHUB_OUTPUT

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9  # v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.rust.lcov.reportPaths=${{ steps.coverage.outputs.lcov_paths }}
