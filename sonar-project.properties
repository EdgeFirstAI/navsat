sonar.projectKey=EdgeFirstAI_navsat
sonar.organization=edgefirstai

sonar.projectName=Maivin NavSat
sonar.projectVersion=0.0.0

sonar.language=rust
sonar.sources=src

# Coverage reports from both CI runners and hardware tests (LCOV format)
sonar.rust.lcov.reportPaths=coverage/**/*.lcov

sonar.exclusions=**/target/**

# Quality gate via PR decoration, not pipeline failure.
# Hardware-backed coverage is currently unavailable (raivin disabled), so the
# long-lived main gate fails even when PR new-code analysis passes.
sonar.qualitygate.wait=false
sonar.host.url=https://sonarcloud.io
